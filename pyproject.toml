[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-sync"
version = "0.2.0"
description = "Sincronização pessoal de Google Drive para Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7", "requests>=2.31,<3"]

[project.scripts]
lume-sync = "lumesync.app:main"
lume-sync-cli = "lumesync.cli:main"

[tool.setuptools.packages.find]
include = ["lumesync*"]
